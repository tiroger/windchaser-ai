[project]
name = "windchaser-ai"
version = "0.1.0"
description = "AWS-native cycling opportunity intelligence and alerting platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = []
modeling = [
    "altair>=6.3.0",
    "boto3>=1.43.121",
    "marimo>=0.25.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

# Python dependencies are managed centrally with uv during the foundation phase.
# Service-specific packages can become uv workspace members when their deployment
# boundaries require independent lock/install sets.

