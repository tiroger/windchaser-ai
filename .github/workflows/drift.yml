name: Terraform Drift

on:
  schedule:
    - cron: "23 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dev-drift:
    if: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' && vars.TERRAFORM_STATE_BUCKET != '' }}
    runs-on: ubuntu-latest
    environment: development
    # Drift is measured against the configuration that was applied, so the plan
    # needs the same variables the apply had. Without alert_email the plan wants
    # to destroy a confirmed SNS subscription every run, and a detector that
    # always reports drift is one nobody reads.
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Detect development drift
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=windchaser-ai/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -detailed-exitcode

