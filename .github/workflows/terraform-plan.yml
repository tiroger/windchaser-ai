name: Terraform Plan

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    # The Terraform root is named dev/prod; the GitHub environment is named
    # development/production, and the OIDC trust policy is scoped to the latter.
    # Map between them here rather than letting the two drift apart.
    environment: >-
      ${{ (inputs.environment || 'dev') == 'prod' && 'production' || 'development' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      # Same variables the apply uses. A plan run with different inputs shows
      # changes the apply would never make, which trains reviewers to skim it.
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Configure AWS credentials with OIDC
        if: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Validate configuration
        working-directory: infrastructure/terraform/environments/${{ env.ENVIRONMENT }}
        run: |
          terraform init -backend=false
          terraform validate

      - name: Plan after bootstrap is configured
        if: ${{ vars.TERRAFORM_STATE_BUCKET != '' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' }}
        working-directory: infrastructure/terraform/environments/${{ env.ENVIRONMENT }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=windchaser-ai/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      # One comment per pull request, replaced on every push, so reviewers read
      # the plan beside the diff rather than in the job log.
      - name: Post the plan on the pull request
        if: ${{ github.event_name == 'pull_request' && vars.TERRAFORM_STATE_BUCKET != '' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' }}
        uses: actions/github-script@v7
        env:
          PLAN_PATH: infrastructure/terraform/environments/${{ env.ENVIRONMENT }}/plan.txt
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan:" + process.env.ENVIRONMENT + " -->";
            let plan = fs.readFileSync(process.env.PLAN_PATH, "utf8");
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ["(no summary line)"])[0];
            const limit = 60000;
            if (plan.length > limit) plan = plan.slice(0, limit) + "\n... truncated; see the job log for the full plan.";
            const body = [
              marker,
              "### Terraform plan · `" + process.env.ENVIRONMENT + "`",
              "**" + summary + "**",
              "<details><summary>Full plan</summary>",
              "",
              "```hcl",
              plan,
              "```",
              "</details>",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

