name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed secrets and generated state
        shell: bash
        run: |
          set -euo pipefail
          # One pattern per -e. An anchor inside an alternation group is a
          # literal in BSD grep and an anchor in GNU grep, so the previous
          # single-regex form silently missed .env and .tfstate on one of them.
          if git ls-files \
            | grep -vE '(^|/)\.env\.example$' \
            | grep -E \
                -e '(^|/)\.env$' \
                -e '(^|/)\.env\.' \
                -e '\.tfstate$' \
                -e '\.tfstate\.' \
                -e '(^|/)tfplan$' \
                -e '\.tfplan$' \
                -e '\.pem$' \
                -e '\.key$' \
                -e '(^|/)\.strava-refresh-token$'; then
            echo "Sensitive or generated files are tracked."
            exit 1
          fi

      - name: Check documentation links and source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/PROJECT_PLAN.md
          test -f docs/architecture/AWS_ARCHITECTURE.md
          test -f docs/architecture/COST_STRATEGY.md
          test -f docs/architecture/TERRAFORM_AND_CICD.md

  terraform-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform format
        run: terraform fmt -recursive -check infrastructure/terraform

      - name: Validate development root
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate production root
        working-directory: infrastructure/terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate bootstrap root
        working-directory: infrastructure/terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install pinned Python and dependencies
        run: |
          uv python install
          uv sync --locked --all-groups

      - name: Verify Python environment
        run: uv run python --version

      - name: Compile the analytics package, services and scripts
        run: |
          uv run python -m compileall -q packages/cycling-analytics services scripts

      - name: Strava worker behaviour
        run: uv run python scripts/test_strava_worker.py

      - name: Calibration builder behaviour
        run: uv run python scripts/test_calibration.py

      - name: Physics parity with the TypeScript implementation
        run: |
          uv run python - <<'PY'
          import sys
          sys.path.insert(0, "packages/cycling-analytics")
          from cycling_analytics.physics import (
              Rider, Section, ride_time, wind_at_rider_height,
          )

          # The section 9 golden fixtures, same reference parameters as the
          # TypeScript suite. Both implementations must agree or predictions
          # diverge between the web app and the Lambda workers.
          rider = Rider(power_w=250, mass_kg=80, cda=0.32, crr=0.005,
                        drivetrain_efficiency=1.0)
          cases = [
              ("calm", [(5000, 90), (5000, 270)], 0.0, 16.29),
              ("8 m/s out-and-back", [(5000, 90), (5000, 270)], 8.0, 19.29),
              ("12 m/s out-and-back", [(5000, 90), (5000, 270)], 12.0, 23.31),
              ("8 m/s point-to-point", [(10000, 90)], 8.0, 10.55),
          ]
          # The fixtures state wind at riding height, while ride_time expects a
          # 10 m forecast wind and scales it down. Invert with the function
          # itself rather than a hand-copied constant.
          factor = wind_at_rider_height(1.0)
          for name, legs, wind, expected in cases:
              sections = [Section(d, b, 0.0) for d, b in legs]
              # Wind from 270 travels toward 90, along the outbound leg.
              got = ride_time(sections, rider, 1.225, 270.0, wind / factor) / 60
              assert abs(got - expected) < 0.05, f"{name}: {got:.2f} != {expected}"
              print(f"  {name}: {got:.2f} min")
          print("physics parity OK")
          PY

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Use the Node version pinned in .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
