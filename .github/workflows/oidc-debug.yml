name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Show the OIDC subject claim
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq $(( (4 - ${#PAYLOAD} % 4) % 4 ))))"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | python3 -c '
import json,sys
d=json.load(sys.stdin)
for k in ("sub","aud","repository","environment","ref","job_workflow_ref"):
    print(f"CLAIM {k}: {d.get(k)}")
'
