name: Deploy Production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Guard on a repository variable only. The apply role ARN is scoped to the
    # GitHub environment, and environment variables are not visible to a
    # job-level if, so testing it here made the job skip unconditionally.
    if: ${{ vars.TERRAFORM_STATE_BUCKET != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Kept out of the repository, which is public. Unset simply means the
      # alert topic is created without a subscriber.
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the environment supplies an apply role
        run: |
          if [ -z "${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}" ]; then
            echo "AWS_TERRAFORM_APPLY_ROLE_ARN is not set for this environment."
            echo "Set it with: gh variable set AWS_TERRAFORM_APPLY_ROLE_ARN --env <name> --body <arn>"
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Apply production infrastructure
        working-directory: infrastructure/terraform/environments/prod
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=windchaser-ai/prod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Production smoke test placeholder
        run: echo "Add canary and rollback checks before the first production release."

