# Amplify build specification.
#
# Lives in the repository rather than in Terraform. A file here takes precedence
# over the app-level spec, is reviewable in a pull request alongside the code it
# builds, and avoids Terraform's yamlencode emitting quoted keys, which Amplify's
# parser handled inconsistently: it accepted the build phase and silently skipped
# preBuild, so nothing was ever installed.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            # Match the Node version the repository pins rather than whatever
            # the build image ships with. The image's nvm otherwise also
            # installs its default global packages (Amplify CLI, Cypress, Hugo,
            # ...), which this build never uses and which twice hung until the
            # 30-minute build limit.
            - nvm install --skip-default-packages $(cat ../../.node-version)
            - nvm use $(cat ../../.node-version)
            - node --version
            - npm ci
        build:
          commands:
            # Amplify exposes environment variables to the build but not to the
            # SSR compute runtime, where AWS_REGION is present and nothing of
            # ours is. Next reads .env.production at build time and carries it
            # into the server bundle, so writing them there is what makes a
            # server route see them at request time.
            # The || true matters: grep exits non-zero when nothing matches, and
            # a missing optional variable must not fail the build.
            # The second half of the list is the Training section's (ADR-0004);
            # docs/architecture/TRAINING_INTEGRATION.md is the authority on it.
            # Names and ARNs only: secret values stay in Secrets Manager.
            - env | grep -E '^(STRAVA_SECRET_ARN|LIVE_AI_ENABLED|APP_DATA_BUCKET|CALIBRATION_S3_KEY|BUNDLE_S3_KEY|WINDCHASER_BRIEFING_MODEL|STRAVA_EVENTS_QUEUE_URL|STRAVA_SUBSCRIPTION_ID|ACTIVITIES_S3_KEY|BIKES_S3_KEY|STREAMS_S3_PREFIX|STREAMS_INDEX_S3_KEY|SAVED_ROUTES_S3_KEY|SAVED_ROUTES_S3_PREFIX|MAINTENANCE_S3_KEY|SETTINGS_S3_KEY|WEB_SECRET_ARN|TRAINING_EVENTS_QUEUE_URL|STRAVA_ATHLETE_ID)=' >> .env.production || true
            # prebuild syncs the MapLibre worker into public/, without which the
            # map renders an empty canvas.
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
